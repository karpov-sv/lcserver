{% load filters %}
<figure class="figure mb-2 p-0">

  {% if fits %}

    <!-- FITS files -->
    {% comment %}
      data-popup-* is what the dialog gathers the rest of the section by, so
      that its Prev and Next step through the images beside this one. See
      popupSiblings() in popup_image.html.
    {% endcomment %}
    <img src="{% url 'target_preview' target.id fits %}?width=256&timestamp={{ target.completed|unix }}"
         class="figure-img img-fluid rounded mb-0" style="max-width: 256px;"
         data-popup-kind="fits"
         data-popup-url="{% url 'target_preview' target.id fits %}?timestamp={{ target.modified|unix }}"
         data-popup-title="{{ fits }}"
         onclick="popupImage(event, this.dataset.popupUrl, this.dataset.popupTitle, true, 'stdview-image', {'data-stretch':1, {% if target.config.target_ra or target.config.target_dec %}'data-mark-ra':{{ target.config.target_ra }}, 'data-mark-dec':{{ target.config.target_dec }},{% endif %} 'data-grid':1, 'data-zoom':1, {% if obj %}'data-obj':1,{%endif %}}, popupSiblings(this))"/>

    <figcaption class="figure-caption text-center text-break mt-0 mb-3">
      <small><a href="{% url 'target_download' target.id fits %}">{{ fits }}</a></small>
    </figcaption>

  {% elif image %}

    <!-- Normal image -->
    {% comment %}
      The caption names the file, which for one kept in a subdirectory is the
      name rather than the path that reaches it - hence the override.
    {% endcomment %}
    <img src="{% url 'target_view' target.id image %}?timestamp={{ target.completed|unix }}"
         class="figure-img img-fluid rounded mb-0" {% if width %}style="max-width: {{ width }};"{% endif %}
         {% if not noclick %}
         data-popup-kind="image"
         data-popup-url="{% url 'target_view' target.id image %}?timestamp={{ target.completed|unix }}"
         data-popup-title="{{ name|default:image }}"
         onclick="popupImage(event, this.dataset.popupUrl, this.dataset.popupTitle, true, '', {}, popupSiblings(this))"
         {% endif %}
         />

    <figcaption class="figure-caption text-center text-break mt-0 mb-3">
      <small><a href="{% url 'target_view' target.id image %}">{{ name|default:image }}</a></small>
    </figcaption>

  {% elif hips %}

    <!-- HiPS cutout -->
    <img src="https://alasky.u-strasbg.fr/hips-image-services/hips2fits?hips={{ hips|urlencode }}&width={{ width }}&height={{ height }}&fov={{ fov }}&ra={{ ra }}&dec={{ dec }}&projection=TAN&coordsys=icrs&rotation_angle=0.0&format=jpg{% if cmap %}&cmap={{ cmap|urlencode }}{% endif %}{% if min_cut %}&min_cut={{ min_cut|urlencode }}{% endif %}{% if max_cut %}&max_cut={{ max_cut|urlencode }}{% endif %}"
         class="figure-img img-fluid rounded mb-0" />
    <figcaption class="figure-caption text-center text-break mt-0 mb-3">
      <small>{{ name|default:hips }}</small>
    </figcaption>

  {% elif skyview %}

    <!-- SkyView cutout -->
    <img src="https://skyview.gsfc.nasa.gov/current/cgi/runquery.pl?Survey={{ skyview|urlencode }}&Pixels={{ width }}&Size={{ fov }}&Position={{ ra }},{{ dec }}&scaling=histeq&LUT={{ "colortables/blue-white.bin"|urlencode }}&Return=GIF{% if catalog %}&Catalog={{ catalog|urlencode }}{% endif %}"
         class="figure-img img-fluid rounded mb-0" />
    <figcaption class="figure-caption text-center text-break mt-0 mb-3">
      <small>{{ skyview }}</small>
    </figcaption>

  {% endif %}

</figure>
